<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engineering Handbook & Documentation Portal</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js (Markdown parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js (Code Syntax Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <!-- KaTeX for Premium LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

    <style>
        :root {
            --bg-primary: #0F0F12;
            --bg-secondary: #16161D;
            --bg-tertiary: #1E1E26;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --accent-purple: #8B5CF6;
            --accent-cyan: #06B6D4;
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-width: 320px;
            --navbar-height: 70px;
            --font-main: 'Outfit', 'Noto Sans Bengali', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        /* PREMIUM LIGHT MODE / DAY MODE (Beautiful Clean Premium White Theme) */
        html.light {
            --bg-primary: #F9FAFB;       /* Beautiful Soft Off-White page background */
            --bg-secondary: #FFFFFF;     /* Pure White for sidebar & header */
            --bg-tertiary: #F3F4F6;      /* Soft Light Gray for inputs/active elements */
            --text-primary: #111827;     /* Clean Dark Slate Charcoal for ultra-high contrast and readability */
            --text-secondary: #4B5563;   /* Premium slate gray for secondary details */
            --accent-purple: #7C3AED;    /* Vibrant Royal Purple */
            --accent-cyan: #0D9488;      /* Deep Teal/Cyan */
            --border-color: rgba(0, 0, 0, 0.08); /* Clean modern soft borders */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar styling with glassmorphism */
        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            z-index: 10;
            transition: margin-left 0.3s ease, transform 0.3s ease;
        }

        aside.collapsed {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .logo-area {
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .logo-icon {
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .search-container {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
        }

        .search-icon {
            position: absolute;
            left: 32px;
            top: 29px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .chapters-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .part-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin: 20px 8px 8px 8px;
            font-weight: 700;
        }

        .chapter-link {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Space out title and checkmark */
            padding: 10px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-check-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            z-index: 5;
        }

        .sidebar-check-btn:hover {
            color: var(--accent-purple);
            transform: scale(1.1);
        }

        .sidebar-check-btn.checked {
            color: #10B981; /* Green checkmark for completed chapters */
        }

        .chapter-link:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .chapter-link.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.15));
            border-left: 3px solid var(--accent-purple);
            color: var(--text-primary);
            font-weight: 600;
            padding-left: 9px;
        }

        /* Main Area Layout */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease;
        }

        /* Nav Header styling */
        header {
            height: var(--navbar-height);
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
            z-index: 5;
        }

        .menu-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
            transition: all 0.2s;
            position: relative;
        }

        .menu-btn:hover {
            border-color: var(--accent-purple);
            background-color: var(--bg-tertiary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .btn-group {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2px;
            background-color: var(--bg-primary);
            gap: 2px;
        }

        .theme-toggle-btn, .font-size-btn, .action-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
            transition: all 0.2s;
            position: relative;
        }

        .theme-toggle-btn:hover, .font-size-btn:hover, .action-btn:hover {
            border-color: var(--accent-purple);
            background-color: var(--bg-tertiary);
        }

        .action-btn.active-theme {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: #fff;
            border: none;
        }

        .btn-label-small {
            font-size: 10px;
            font-weight: 800;
            margin-left: 2px;
        }

        /* Content Container with reader options */
        .content-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 48px;
            display: flex;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .content-container {
                padding: 20px 16px;
            }
        }

        article {
            width: 100%;
            max-width: 820px;
            line-height: 1.7;
            font-size: 16px;
            position: relative;
        }

        /* Premium Typography & Markdown styling */
        article h1 {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        article h2 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 40px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--text-primary);
        }

        article h3 {
            font-size: 19px;
            font-weight: 600;
            margin-top: 28px;
            margin-bottom: 12px;
            color: var(--accent-cyan);
        }

        article p {
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        article ul, article ol {
            margin-bottom: 20px;
            padding-left: 24px;
            color: var(--text-secondary);
        }

        article li {
            margin-bottom: 8px;
        }

        /* Fenced Code Highlights */
        article pre {
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            margin: 24px 0;
            transition: all 0.3s ease;
            position: relative; /* Essential for floating copy button */
        }

        .copy-code-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
            z-index: 5;
            opacity: 0;
        }

        article pre:hover .copy-code-btn {
            opacity: 1;
        }

        .copy-code-btn:hover {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        pre.code-theme-gray .copy-code-btn {
            background: rgba(0, 0, 0, 0.05);
            color: #1A2421;
            border-color: rgba(0, 0, 0, 0.1);
        }
        pre.code-theme-gray .copy-code-btn:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }

        /* Estimated Reading Time & Word Count Metadata */
        .chapter-meta {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: -12px;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        article code {
            font-family: var(--font-mono);
            font-size: 14px;
        }

        article :not(pre) > code {
            background-color: var(--bg-tertiary);
            padding: 3px 6px;
            border-radius: 4px;
            color: var(--accent-purple);
            font-weight: 500;
        }

        /* CALLOUTS BOXES */
        .callout-box {
            padding: 20px 24px;
            border-radius: 12px;
            margin: 28px 0;
            border-left: 4px solid var(--accent-purple);
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.05), transparent);
            transition: background 0.3s ease;
        }

        /* ADAPT CARDS BEAUTIFULLY IN LIGHT MODE */
        html.light .callout-box {
            background: rgba(124, 58, 237, 0.04) !important; /* Extremely subtle violet tint */
            border: 1px solid rgba(124, 58, 237, 0.08) !important;
            border-left: 4px solid var(--accent-purple) !important;
        }

        .callout-box.developer {
            border-left-color: var(--accent-cyan);
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.05), transparent);
        }

        html.light .callout-box.developer {
            background: rgba(13, 148, 136, 0.04) !important; /* Subtle teal/cyan tint */
            border: 1px solid rgba(13, 148, 136, 0.08) !important;
            border-left-color: var(--accent-cyan) !important;
        }

        .callout-box.warning {
            border-left-color: #EF4444;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.05), transparent);
        }

        html.light .callout-box.warning {
            background: rgba(239, 68, 68, 0.04) !important; /* Subtle red tint */
            border: 1px solid rgba(239, 68, 68, 0.08) !important;
            border-left-color: #EF4444 !important;
        }

        .callout-title {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* DYNAMIC THEMES FOR VISUAL DIAGRAMS (Matrix, Cyberpunk, Slate) */
        .visual-pre {
            padding: 20px !important;
            border-radius: 10px !important;
            overflow-x: auto !important;
            font-family: var(--font-mono) !important;
            transition: all 0.3s ease;
        }

        /* Theme 1: Gorgeous Sage Green (#ACAEA2) with deep charcoal highly legible text */
        .visual-pre.theme-matrix {
            background-color: #ACAEA2 !important;
            color: #1A2421 !important; /* Deep dark slate forest green for contrast */
            border: 1px solid rgba(0, 0, 0, 0.15) !important;
        }
        .visual-pre.theme-matrix code {
            color: #1A2421 !important;
        }

        /* Theme 2: Cyberpunk / Synthwave */
        .visual-pre.theme-cyberpunk {
            background-color: #0b0c16 !important;
            color: #FF007F !important;
            border: 1px solid rgba(255, 0, 127, 0.35) !important;
        }
        .visual-pre.theme-cyberpunk code {
            color: #00F0FF !important; /* Glowing Blue codes on Pink ASCII lines */
        }
        
        /* Premium Light Cyberpunk Theme in Day Mode */
        html.light .visual-pre.theme-cyberpunk {
            background-color: #CAD8EE !important; /* Premium light blue-gray background requested by user */
            color: #1E3A8A !important; /* Deep navy blue for high-contrast ASCII drawings and borders */
            border: 1px solid rgba(30, 58, 138, 0.25) !important;
        }
        html.light .visual-pre.theme-cyberpunk code {
            color: #025989 !important; /* Rich, readable blue for nested codes */
        }

        /* Theme 3: Slate High Contrast */
        .visual-pre.theme-slate {
            background-color: var(--bg-tertiary) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
        }
        .visual-pre.theme-slate code {
            color: var(--text-primary) !important;
        }

        /* Force code element backgrounds to be transparent so pre container background determines the color */
        article pre code,
        article pre .hljs {
            background: transparent !important;
            background-color: transparent !important;
            padding: 0 !important;
        }

        /* DYNAMIC BACKGROUND COLOR THEMES FOR CODE BLOCKS (pre tags) */

        /* 1. BLACK THEME (Deep Dark in Dark Mode, Soft Off-white/Light Gray in Light Mode) */
        html.dark pre.code-theme-black {
            background-color: #0b0b0f !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
            color: #e5e7eb !important;
        }
        html.dark pre.code-theme-black code {
            color: #e5e7eb !important;
        }

        html.light pre.code-theme-black {
            background-color: #f3f4f6 !important; /* Premium Off-White/Light Gray card background */
            border-color: rgba(0, 0, 0, 0.08) !important;
            color: #1f2937 !important;
        }
        html.light pre.code-theme-black code {
            color: #1f2937 !important;
        }
        /* Custom light token color overrides for Black theme in Light Mode */
        html.light pre.code-theme-black .hljs-keyword,
        html.light pre.code-theme-black .hljs-built_in,
        html.light pre.code-theme-black .hljs-selector-tag {
            color: #4f46e5 !important; /* Premium Vibrant Indigo */
            font-weight: 700 !important;
        }
        html.light pre.code-theme-black .hljs-string,
        html.light pre.code-theme-black .hljs-attr {
            color: #059669 !important; /* Rich Emerald Green */
            font-weight: 600 !important;
        }
        html.light pre.code-theme-black .hljs-title,
        html.light pre.code-theme-black .hljs-section {
            color: #1d4ed8 !important; /* Royal Blue */
            font-weight: 700 !important;
        }
        html.light pre.code-theme-black .hljs-comment {
            color: #6b7280 !important; /* Medium Slate Gray */
            font-style: italic !important;
        }
        html.light pre.code-theme-black .hljs-number,
        html.light pre.code-theme-black .hljs-literal {
            color: #b91c1c !important; /* Crimson Red */
            font-weight: 600 !important;
        }

        /* 2. SAGE GREEN THEME (#ACAEA2) - Keep as signature light Sage Green for both modes */
        pre.code-theme-gray {
            background-color: #ACAEA2 !important;
            border-color: rgba(0, 0, 0, 0.12) !important;
            color: #1A2421 !important; /* Deep dark slate forest green */
        }
        pre.code-theme-gray code {
            color: #1A2421 !important;
        }
        pre.code-theme-gray .hljs-keyword,
        pre.code-theme-gray .hljs-built_in,
        pre.code-theme-gray .hljs-selector-tag {
            color: #7C2D12 !important; /* Warm deep orange/brown keywords */
            font-weight: 700 !important;
        }
        pre.code-theme-gray .hljs-string,
        pre.code-theme-gray .hljs-attr {
            color: #065F46 !important; /* Emerald green for strings */
            font-weight: 600 !important;
        }
        pre.code-theme-gray .hljs-title,
        pre.code-theme-gray .hljs-section {
            color: #1E3A8A !important; /* Dark navy blue for class/func titles */
            font-weight: 700 !important;
        }
        pre.code-theme-gray .hljs-comment {
            color: #4B5563 !important; /* Dark slate comments */
            font-style: italic !important;
        }
        pre.code-theme-gray .hljs-number,
        pre.code-theme-gray .hljs-literal {
            color: #9D174D !important; /* Burgundy/crimson for numbers */
            font-weight: 600 !important;
        }

        /* 3. SEPIA BROWN THEME (Soft Charcoal-Brown in Dark Mode, Soft Cream in Light Mode) */
        html.dark pre.code-theme-brown {
            background-color: #2D2520 !important;
            border-color: rgba(230, 175, 120, 0.15) !important;
            color: #f5f5f4 !important;
        }
        html.dark pre.code-theme-brown code {
            color: #f5f5f4 !important;
        }

        html.light pre.code-theme-brown {
            background-color: #faf6f0 !important; /* Warm Cream background */
            border-color: #e6d8c8 !important;
            color: #4a3e3d !important; /* Warm Deep Dark Brown text */
        }
        html.light pre.code-theme-brown code {
            color: #4a3e3d !important;
        }
        /* Custom light token color overrides for Brown theme in Light Mode */
        html.light pre.code-theme-brown .hljs-keyword,
        html.light pre.code-theme-brown .hljs-built_in,
        html.light pre.code-theme-brown .hljs-selector-tag {
            color: #b45309 !important; /* Soft Amber Bronze */
            font-weight: 700 !important;
        }
        html.light pre.code-theme-brown .hljs-string,
        html.light pre.code-theme-brown .hljs-attr {
            color: #15803d !important; /* Warm Forest Green */
            font-weight: 600 !important;
        }
        html.light pre.code-theme-brown .hljs-title,
        html.light pre.code-theme-brown .hljs-section {
            color: #a21caf !important; /* Warm Purple */
            font-weight: 700 !important;
        }
        html.light pre.code-theme-brown .hljs-comment {
            color: #857a75 !important; /* Soft Warm Gray comments */
            font-style: italic !important;
        }
        html.light pre.code-theme-brown .hljs-number,
        html.light pre.code-theme-brown .hljs-literal {
            color: #be123c !important; /* Crimson Red */
            font-weight: 600 !important;
        }

        /* 4. SOFT BLUE THEME (Midnight Blue in Dark Mode, Soft Pastel Blue in Light Mode) */
        html.dark pre.code-theme-blue {
            background-color: #161D28 !important;
            border-color: rgba(56, 189, 248, 0.15) !important;
            color: #f0f9ff !important;
        }
        html.dark pre.code-theme-blue code {
            color: #f0f9ff !important;
        }

        html.light pre.code-theme-blue {
            background-color: #f0f7ff !important; /* Light sky blue background */
            border-color: #d0e1fd !important;
            color: #1e293b !important; /* Dark Slate Blue text */
        }
        html.light pre.code-theme-blue code {
            color: #1e293b !important;
        }
        /* Custom light token color overrides for Blue theme in Light Mode */
        html.light pre.code-theme-blue .hljs-keyword,
        html.light pre.code-theme-blue .hljs-built_in,
        html.light pre.code-theme-blue .hljs-selector-tag {
            color: #0369a1 !important; /* Vibrant Ocean Blue */
            font-weight: 700 !important;
        }
        html.light pre.code-theme-blue .hljs-string,
        html.light pre.code-theme-blue .hljs-attr {
            color: #0f766e !important; /* Soft Deep Teal */
            font-weight: 600 !important;
        }
        html.light pre.code-theme-blue .hljs-title,
        html.light pre.code-theme-blue .hljs-section {
            color: #6d28d9 !important; /* Royal Purple */
            font-weight: 700 !important;
        }
        html.light pre.code-theme-blue .hljs-comment {
            color: #64748b !important; /* Medium Slate comments */
            font-style: italic !important;
        }
        html.light pre.code-theme-blue .hljs-number,
        html.light pre.code-theme-blue .hljs-literal {
            color: #c2410c !important; /* Burnt Orange */
            font-weight: 600 !important;
        }

        /* 5. COPY CODE BUTTON STYLING BY WEBSITE THEME STATE */
        html.light pre .copy-code-btn {
            background: rgba(0, 0, 0, 0.04) !important;
            color: #1f2937 !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
        }
        html.light pre .copy-code-btn:hover {
            background: var(--accent-purple) !important;
            color: #fff !important;
            border-color: var(--accent-purple) !important;
        }

        html.dark pre.code-theme-black .copy-code-btn,
        html.dark pre.code-theme-brown .copy-code-btn,
        html.dark pre.code-theme-blue .copy-code-btn {
            background: rgba(255, 255, 255, 0.06) !important;
            color: #e5e7eb !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        html.dark pre.code-theme-black .copy-code-btn:hover,
        html.dark pre.code-theme-brown .copy-code-btn:hover,
        html.dark pre.code-theme-blue .copy-code-btn:hover {
            background: var(--accent-purple) !important;
            color: #fff !important;
            border-color: var(--accent-purple) !important;
        }

        /* Horizontal dividers */
        hr {
            border: 0;
            height: 1px;
            background-color: var(--border-color);
            margin: 40px 0;
        }

        /* Tables styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 15px;
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid var(--border-color);

        }

        th {
            background-color: var(--bg-secondary);
            font-weight: 600;
        }

        /* Interactive Interview Flashcard Widget */
        .flashcard {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;

        .flashcard-q {
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);

        .flashcard-a {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            color: var(--text-secondary);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Mobile Layouts & Sidebar Backdrop overlay */
        .sidebar-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 9;
            display: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-backdrop.open {
            display: block;
        }

        @media (max-width: 900px) {
            aside {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 0;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            }

            aside.open {
                left: 0;
            }
        }

        /* Desktop vs Mobile Controls Visibility */
        .mobile-settings-btn {
            display: none;
        }

        .desktop-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .mobile-settings-btn {
                display: flex !important;
            }
            .desktop-controls {
                display: none !important;
            }
        }

        /* Settings Sheet (Bottom Sheet for Mobile, Floating Panel for Desktop) */
        .settings-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            border-radius: 24px 24px 0 0;
            z-index: 200;
            padding: 24px 24px 32px 24px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-sheet.open {
            bottom: 0;
        }

        .settings-sheet-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 199;
            display: none;
        }

        .settings-sheet-backdrop.open {
            display: block;
        }

        .settings-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-sheet-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-sheet-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .settings-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .settings-option:last-child {
            border-bottom: none;
        }

        .option-label {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-controls {
            display: flex;
            gap: 8px;
        }

        .sheet-btn {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .sheet-btn:hover {
            border-color: var(--accent-purple);
        }

        /* Responsive table wrapping */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 24px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
        }
        .table-container table {
            margin: 0 !important;
            border: none !important;
        }

        /* PREMIUM CHAPTER NAVIGATION BUTTONS */
        .chapter-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
            gap: 20px;
        }

        .nav-prev-btn, .nav-next-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            max-width: 48%;
            flex-grow: 1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .nav-next-btn {
            text-align: right;
            justify-content: flex-end;
        }

        .nav-prev-btn:hover {
            transform: translateX(-4px);
            border-color: var(--accent-purple);
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.05), transparent);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.1);
        }

        .nav-next-btn:hover {
            transform: translateX(4px);
            border-color: var(--accent-purple);
            background: linear-gradient(270deg, rgba(139, 92, 246, 0.05), transparent);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.1);

        .nav-arrow {
            font-size: 18px;
            color: var(--accent-purple);
            transition: transform 0.2s ease;
        }

        .nav-prev-btn:hover .nav-arrow {
            transform: scale(1.15);
        }

        .nav-next-btn:hover .nav-arrow {
            transform: scale(1.15);
        }

        .nav-btn-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            width: 100%;
        }

        .nav-dir-sub {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .nav-chapter-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Responsive Chapter Nav */
        @media (max-width: 600px) {
            .chapter-navigation {
                flex-direction: column;
                gap: 16px;
            }
            .nav-prev-btn, .nav-next-btn {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR CHAPTER DIRECTORY -->
    <aside id="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-brain logo-icon" style="flex-shrink: 0;"></i>
            <div style="display: flex; flex-direction: column; justify-content: center; line-height: 1.2;">
                <span class="logo-text">AI Handbook</span>
                <span style="font-size: 10px; color: var(--text-secondary); font-weight: 600; margin-top: 3px; letter-spacing: 0.2px;">Created by Asif Rabetul</span>
            </div>
        </div>
        
        <!-- SIDEBAR PROGRESS TRACKER -->
        <div class="sidebar-progress-container" style="padding: 16px 20px 0 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">
                <span>Reading Progress</span>

        <div class="search-container">

        </div>
        <div class="chapters-list" id="chaptersList">
            <!-- Sidebar links populated dynamically by JavaScript -->
        </div>
    </aside>

    <!-- MAIN READER INTERFACE -->
    <main style="position: relative;">
        <!-- Scroll progress bar -->
        <div id="scrollProgress" style="position: absolute; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan)); z-index: 100; transition: width 0.1s ease;"></div>
        <header>
            <div style="display: flex; align-items: center; gap: 16px;">
                <button class="menu-btn" onclick="toggleSidebar()" title="সাইডবার হাইড/শো করুন">

                </button>
                <div id="chapterTitleHeader" style="font-weight: 600; font-size: 16px;">
                    Chapter Loading...
                </div>
            </div>
            
            <div class="header-actions">
                <!-- Mobile Preferences toggle -->
                <button class="action-btn mobile-settings-btn" onclick="toggleSettingsSheet()" title="Reader Preferences">
                    <i class="fa-solid fa-sliders"></i>
                </button>

                <div class="desktop-controls">
                    <!-- CODE BLOCK THEME SWITCHER -->
                    <button class="action-btn" onclick="cycleCodeTheme()" id="codeThemeBtn" title="Code ব্যাকগ্রাউন্ড থিম (Black, Sage Green #ACAEA2, Soft Brown, Soft Whitish Blue)">
                        <i class="fa-solid fa-code"></i>
                    </button>

                    <!-- BOLD +/- WEIGHT CONTROL GROUP -->
                    <div class="btn-group" title="লেখার গাঢ়তা (Bold Weight) কমান/বাড়ান">
                        <button class="action-btn" style="border:none;" onclick="adjustBold(-1)">
                            <i class="fa-solid fa-bold" style="font-size: 10px;"></i><span class="btn-label-small">-</span>
                        </button>
                        <button class="action-btn" style="border:none;" onclick="adjustBold(1)">
                            <i class="fa-solid fa-bold"></i><span class="btn-label-small">+</span>
                        </button>
                    </div>

                    <!-- DIAGRAM PALETTE THEME CONTROL -->
                    <button class="action-btn" onclick="cycleVisualTheme()" id="diagramThemeBtn" title="Diagramের নিওন থিম টগল (৩টি কালার থিম)">
                        <i class="fa-solid fa-palette"></i>
                    </button>

                    <!-- FONT SIZE CONTROL -->
                    <button class="font-size-btn" onclick="toggleFontSize()" title="ফন্ট সাইজ পরিবর্তন">
                        <i class="fa-solid fa-font"></i>
                    </button>

                    <!-- THEME DAY/DARK TOGGLE -->
                    <button class="theme-toggle-btn" onclick="toggleTheme()" title="থিম পরিবর্তন (দিন/রাত)">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </header>
        
        <div class="content-container">
            <article id="markdownContent">
                <!-- Chapter Content Rendered Dynamically Here -->
            </article>
        </div>

    <script>
        // Chapter indexing matching standard table of contents
        const syllabus = [
            {
                part: "Part 1 — AI Foundations (AI এর সূচনা)",
                chapters: [
                    { num: 1, title: "Paradigm Shift" },
                    { num: 2, title: "The Core Mechanics" }
                ]
            },
            {
                part: "Part 2 — Machine Learning (মেশিন লার্নিংয়ের ভেতরের কাজ)",
                chapters: [
                    { num: 3, title: "The Math of Learning" },
                    { num: 4, title: "Generalization & Sweet Spot" }
                ]
            },
            {
                part: "Part 3 — Deep Learning & Neural Networks",
                chapters: [
                    { num: 5, title: "Artificial Neurons" },
                    { num: 6, title: "Deep Networks & Backpropagation" }
                ]
            },
            {
                part: "Part 4 — Modern AI Foundations (আধুনিক ভিত্তি)",
                chapters: [
                    { num: 7, title: "Transformers & Attention" },
                    { num: 8, title: "Tokens, Embeddings & Context" }
                ]
            },
            {
                part: "Part 5 — LLMs (লার্জ Language Model)",
                chapters: [
                    { num: 9, title: "LLM Ecosystem" },
                    { num: 10, title: "Reasoning Models (R1 & o3)" }
                ]
            },
            {
                part: "Part 6 — AI Data Layer (Vector Data)",
                chapters: [
                    { num: 11, title: "Vector & Distance Metrics" },
                    { num: 12, title: "Vector Databases & Indexing" }
                ]
            },
            {
                part: "Part 7 — RAG (Retrieval Augmented Generation)",
                chapters: [
                    { num: 13, title: "RAG Fundamentals" },
                    { num: 14, title: "Advanced Retrieval & Hybrid Search" }
                ]
            },
            {
                part: "Part 8 — Fine-Tuning (Model Fine-Tuning)",
                chapters: [
                    { num: 15, title: "SFT & Dataset Template" },
                    { num: 16, title: "PEFT (LoRA & QLoRA)" },
                    { num: 17, title: "RLHF, DPO & Safety Tuning" }
                ]
            },
            {
                part: "Part 9 — Agentic AI & Tool Calling (এজেন্ট)",
                chapters: [
                    { num: 18, title: "AI Agents & ReAct" },
                    { num: 19, title: "Tool Calling Contracts" },
                    { num: 20, title: "Model Context Protocol (MCP)" }
                ]
            },
            {
                part: "Part 10 — Production AI (প্রোডাকশন-গ্রেড)",
                chapters: [
                    { num: 21, title: "Constitutional Safety Harness" },
                    { num: 22, title: "Observability & Tracing" },
                    { num: 23, title: "Cost Optimization & Guardrails" }
                ]
            },
            {
                part: "Part 11 — Building Real AI Products (বাস্তব Blueprint)",
                chapters: [
                    { num: 24, title: "Blueprint 1: Multi-Session Memory" },
                    { num: 25, title: "Blueprint 2: Enterprise PDF Search" },
                    { num: 26, title: "Blueprint 3: CLI Agent Auto-Healing" },
                    { num: 27, title: "Blueprint 4: AI SaaS & Billing" }
                ]
            },
            {
                part: "Part 12 — AI Career Roadmap (ক্যারিয়ার গাইড)",
                chapters: [
                    { num: 28, title: "Transitioning to an AI Architect" }
                ]
            }
        ];

        let currentChapterNum = 1;
        let isLight = false; // Restore default Dark Mode (#0F0F12 page background)!
        let fontSizeMode = 0; // 0 = standard, 1 = large, 2 = larger
        let currentFontWeight = 400; // 300 (Light), 400 (Normal), 500 (Medium), 600 (Bold)
        let currentVisualTheme = 'matrix'; // matrix, cyberpunk, slate
        let currentCodeTheme = 'gray'; // Keep premium Sage Green #ACAEA2 cards by default!

        // Populate sidebar
        function populateSidebar() {
            const listDiv = document.getElementById("chaptersList");
            listDiv.innerHTML = "";
            
            syllabus.forEach(part => {
                const header = document.createElement("div");
                header.className = "part-header";
                header.innerText = part.part;
                listDiv.appendChild(header);
                
                part.chapters.forEach(ch => {
                    const isCompleted = getCompletedChapters().includes(ch.num);
                    const link = document.createElement("a");
                    link.className = `chapter-link ${ch.num === currentChapterNum ? 'active' : ''}`;
                    link.id = `ch-link-${ch.num}`;
                    
                    // Left Side: Icon & Title
                    const leftSpan = document.createElement("span");
                    leftSpan.style.display = "flex";
                    leftSpan.style.alignItems = "center";
                    leftSpan.style.gap = "10px";
                    leftSpan.innerHTML = `<i class="fa-solid fa-book-open"></i> <span>Ch ${ch.num}: ${ch.title}</span>`;
                    leftSpan.onclick = () => loadChapter(ch.num);
                    link.appendChild(leftSpan);
                    
                    // Right Side: Completion Checkmark Button
                    const checkBtn = document.createElement("button");
                    checkBtn.className = `sidebar-check-btn ${isCompleted ? 'checked' : ''}`;
                    checkBtn.innerHTML = isCompleted ? `<i class="fa-solid fa-circle-check"></i>` : `<i class="fa-regular fa-circle"></i>`;
                    checkBtn.title = isCompleted ? "পঠিত হিসেবে চিহ্নিত (পড়া শেষ)" : "অপঠিত হিসেবে চিহ্নিত (পড়া বাকি)";
                    checkBtn.onclick = (e) => {
                        e.stopPropagation();
                        toggleChapterCompletion(ch.num);
                    };
                    link.appendChild(checkBtn);
                    
                    listDiv.appendChild(link);
                });
            });
        }

        // Toggle Sidebar for both Desktop and Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const backdrop = document.getElementById("sidebarBackdrop");
            if (window.innerWidth <= 900) {
                const isOpen = sidebar.classList.toggle("open");
                sidebar.classList.remove("collapsed");
                if (backdrop) {
                    if (isOpen) {
                        backdrop.classList.add("open");
                    } else {
                        backdrop.classList.remove("open");
                    }
                }
            } else {
                sidebar.classList.toggle("collapsed");
                sidebar.classList.remove("open");
                if (backdrop) {
                    backdrop.classList.remove("open");
                }
            }
        }

        // Toggle Mobile Bottom Settings Sheet
        function toggleSettingsSheet() {
            const sheet = document.getElementById("settingsSheet");
            const backdrop = document.getElementById("settingsBackdrop");
            if (sheet) sheet.classList.toggle("open");
            if (backdrop) backdrop.classList.toggle("open");
        }

        // Toggle Theme Day/Night
        function toggleTheme() {
            isLight = !isLight;
            document.documentElement.className = isLight ? "light" : "dark";
            const icon = document.getElementById("themeIcon");
            icon.className = isLight ? "fa-solid fa-sun" : "fa-solid fa-moon";
            
            if (currentVisualTheme === 'slate') {
                applyVisualThemeToPage();
            }
            decorateCodeThemeButton();
            decorateVisualThemeButton();
            localStorage.setItem('themeState', isLight ? 'light' : 'dark');
        }

        // Adjust Font Boldness Weight step-by-step
        function adjustBold(direction) {
            const weights = [300, 400, 500, 600];
            let idx = weights.indexOf(currentFontWeight);
            
            if (direction === 1 && idx < weights.length - 1) {
                idx++;
            } else if (direction === -1 && idx > 0) {
                idx--;
            }
            
            currentFontWeight = weights[idx];
            applyFontWeightToPage();
        }

        function applyFontWeightToPage() {
            const article = document.getElementById("markdownContent");
            const selectors = article.querySelectorAll("p, li, th, td");
            selectors.forEach(el => {
                el.style.fontWeight = currentFontWeight;
            });
            localStorage.setItem('fontWeight', currentFontWeight);
        }

        // Cycle through 3 different visual diagram themes (Matrix, Cyberpunk, Slate)
        function cycleVisualTheme() {
            const themes = ['matrix', 'cyberpunk', 'slate'];
            const idx = themes.indexOf(currentVisualTheme);
            currentVisualTheme = themes[(idx + 1) % themes.length];
            
            applyVisualThemeToPage();
            decorateVisualThemeButton();
            
            localStorage.setItem('visualTheme', currentVisualTheme);
        }

        // Decorate diagram theme switcher button dynamically
        function decorateVisualThemeButton() {
            const btn = document.getElementById("diagramThemeBtn");
            if (!btn) return;
            if (currentVisualTheme === 'cyberpunk') {
                btn.className = "action-btn active-theme";
                if (isLight) {
                    btn.style.background = "linear-gradient(135deg, #FF66B2, #33CCFF)"; // Soft pastel cyberpunk gradient
                } else {
                    btn.style.background = "linear-gradient(135deg, #FF007F, #00F0FF)"; // Neon gradient
                }
            } else if (currentVisualTheme === 'slate') {
                btn.className = "action-btn active-theme";
                if (isLight) {
                    btn.style.background = "linear-gradient(135deg, #9CA3AF, #4B5563)"; // Light Slate gradient
                } else {
                    btn.style.background = "linear-gradient(135deg, #6B7280, #374151)"; // Dark Slate gradient
                }
            } else {
                btn.className = "action-btn";
                btn.style.background = "";
            }
        }

        // Converted default matrix theme to #ACAEA2 background & deep dark text!
        function applyVisualThemeToPage() {
            const preElements = document.querySelectorAll('.visual-pre');
            preElements.forEach(pre => {
                pre.className = `visual-pre theme-${currentVisualTheme}`;
            });
        }

        // Cycle through 4 different code block background themes (Black, Sage Green #ACAEA2, Brown, Soft Whitish Blue)
        function cycleCodeTheme() {
            const themes = ['black', 'gray', 'brown', 'blue'];
            const idx = themes.indexOf(currentCodeTheme);
            currentCodeTheme = themes[(idx + 1) % themes.length];
            
            applyCodeThemeToPage();
            decorateCodeThemeButton();
            
            localStorage.setItem('codeTheme', currentCodeTheme);
        }

        // Sage code theme is default
        function decorateCodeThemeButton() {
            const btn = document.getElementById("codeThemeBtn");
            if (currentCodeTheme === 'gray') {
                btn.style.background = "#ACAEA2";
                btn.style.color = "#1A2421";
                btn.style.borderColor = "#1A2421";
            } else if (currentCodeTheme === 'brown') {
                if (isLight) {
                    btn.style.background = "#faf6f0";
                    btn.style.color = "#4a3e3d";
                    btn.style.borderColor = "#e6d8c8";
                } else {
                    btn.style.background = "#2D2520";
                    btn.style.color = "#E6AF78";
                    btn.style.borderColor = "#E6AF78";
                }
            } else if (currentCodeTheme === 'blue') {
                if (isLight) {
                    btn.style.background = "#f0f7ff";
                    btn.style.color = "#1e293b";
                    btn.style.borderColor = "#d0e1fd";
                } else {
                    btn.style.background = "#161D28";
                    btn.style.color = "#38BDF8";
                    btn.style.borderColor = "#38BDF8";
                }
            } else if (currentCodeTheme === 'black') {
                if (isLight) {
                    btn.style.background = "#f3f4f6";
                    btn.style.color = "#1f2937";
                    btn.style.borderColor = "rgba(0, 0, 0, 0.1)";
                } else {
                    btn.style.background = "#0b0b0f";
                    btn.style.color = "#e5e7eb";
                    btn.style.borderColor = "rgba(255, 255, 255, 0.15)";
                }
            } else {
                btn.style.background = "";
                btn.style.color = "";
                btn.style.borderColor = "";
            }
        }

        function applyCodeThemeToPage() {
            const preElements = document.querySelectorAll('pre');
            preElements.forEach(pre => {
                pre.classList.remove('code-theme-black', 'code-theme-brown', 'code-theme-gray', 'code-theme-blue');
                pre.classList.add(`code-theme-${currentCodeTheme}`);
            });
        }

        // Cycle Font Size
        function toggleFontSize() {
            adjustFontSize(1);
        }

        // Adjust Font Size (direction +1 or -1)
        function adjustFontSize(direction) {
            fontSizeMode = (fontSizeMode + direction + 3) % 3;
            const article = document.getElementById("markdownContent");
            if (fontSizeMode === 0) {
                article.style.fontSize = "16px";
            } else if (fontSizeMode === 1) {
                article.style.fontSize = "18px";
            } else {
                article.style.fontSize = "20px";
            }
        }

        // Fetch and Render Markdown Chapter via marked.js
        async function loadChapter(chNum) {
            currentChapterNum = chNum;
            populateSidebar();
            
            document.getElementById("sidebar").classList.remove("open");
            const sidebarBackdrop = document.getElementById("sidebarBackdrop");
            if (sidebarBackdrop) sidebarBackdrop.classList.remove("open");
            
            // Also close settings sheet on chapter load
            const sheet = document.getElementById("settingsSheet");
            const settingsBackdrop = document.getElementById("settingsBackdrop");
            if (sheet) sheet.classList.remove("open");
            if (settingsBackdrop) settingsBackdrop.classList.remove("open");
            
            const headerTitle = document.getElementById("chapterTitleHeader");
            headerTitle.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Chapter ${chNum} Loading...`;
            
            try {
                const response = await fetch(`/handbook/chapter_${chNum}.md`);
                if (!response.ok) throw new Error("Chapter file not found");
                
                let text = await response.text();
                
                // Parse custom visual callouts inside our chapter files into 3-theme controllable pre blocks!
                // Handles \r\n (CRLF) line endings, extracts Title for header, strips metadata lines
                text = text.replace(/\[VISUAL\]([\s\S]*?)(?=\r?\n---|\r?\n\r?\n###)/g, (match, content) => {
                    // Extract title from "Title: ..." line
                    const titleMatch = content.match(/Title:\s*(.+)/);
                    const title = titleMatch ? titleMatch[1].trim() : 'Visual Explanation / Architecture Map';
                    
                    // Strip metadata lines (Title, Illustration, Placement, Purpose)
                    let diagram = content
                        .replace(/^Title:\s*.+$/gm, '')
                        .replace(/^Illustration:\s*.+$/gm, '')
                        .replace(/^Placement:\s*.+$/gm, '')
                        .replace(/^Purpose:\s*.+$/gm, '')
                        .trim();
                    
                    // Extract content inside ``` code fences if present
                    const codeBlockMatch = diagram.match(/```[\w]*\r?\n([\s\S]*?)```/);
                    if (codeBlockMatch) {
                        diagram = codeBlockMatch[1].trimEnd();
                    }
                    
                    return `<div class="callout-box developer">
                        <div class="callout-title">
                            <span><i class="fa-solid fa-diagram-project"></i> ${title}</span>
                        </div>
                        <pre class="visual-pre theme-${currentVisualTheme}"><code class="language-plaintext">${diagram}</code></pre>
                    </div>`;
                });
                
                // Wrap Developer Perspective callouts dynamically
                text = text.replace(/💻 Developer View([\s\S]*?)(?=\r?\n##|$)/g, (match, content) => {
                    return `<div class="callout-box developer">
                        <div class="callout-title"><i class="fa-solid fa-laptop-code"></i> Developer Perspective</div>
                        ${content.trim()}
                    </div>`;
                });
                
                // Wrap Production Reality callouts dynamically
                text = text.replace(/🏭 Production Reality([\s\S]*?)(?=\r?\n##|$)/g, (match, content) => {
                    return `<div class="callout-box">
                        <div class="callout-title"><i class="fa-solid fa-server"></i> Production Reality</div>
                        ${content.trim()}
                    </div>`;
                });
                
                // Wrap Common Mistakes callouts dynamically
                text = text.replace(/🔴 Common Mistake([\s\S]*?)(?=\r?\n##|$)/g, (match, content) => {
                    return `<div class="callout-box warning">
                        <div class="callout-title"><i class="fa-solid fa-triangle-exclamation"></i> Common Mistake / Pitfall</div>
                        ${content.trim()}
                    </div>`;
                });
                
                // Clean up any remaining '---' horizontal rules so they are completely removed from display
                text = text.replace(/\r?\n---/g, '');

                // Render Markdown
                const contentDiv = document.getElementById("markdownContent");
                contentDiv.innerHTML = marked.parse(text);
                
                // Wrap all tables in a table-container for horizontal scrolling on mobile
                contentDiv.querySelectorAll('table').forEach(table => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-container';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                });
                
                // Set Header title
                const mainH1 = contentDiv.querySelector("h1");
                headerTitle.innerText = mainH1 ? mainH1.innerText : `Chapter ${chNum}`;
                
                // Run Syntax Highlighting
                contentDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
                
                // Inject Estimated Reading Time & Word Count Metadata
                updateChapterMetadata();

                // Inject Floating "Copy Code" Buttons to each pre block
                contentDiv.querySelectorAll('pre').forEach((pre) => {
                    if (!pre.querySelector('.copy-code-btn')) {
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-code-btn';
                        copyBtn.onclick = (e) => {
                            e.stopPropagation();
                            copyCode(copyBtn);
                        };
                        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
                        copyBtn.title = 'Code কপি করুন';
                        pre.appendChild(copyBtn);
                    }
                });
                
                // Render KaTeX Math equations
                if (window.renderMathInElement) {
                    renderMathInElement(contentDiv, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false}
                        ],
                        throwOnError: false
                    });
                }
                
                // Transform Interview Questions into Interactive Flashcards!
                setupInteractiveInterviewQuestions();
                
                // Append Next & Previous Chapter Navigation Arrows
                const navDiv = document.createElement("div");
                navDiv.className = "chapter-navigation";
                
                let prevCh = null;
                let nextCh = null;
                syllabus.forEach(part => {
                    part.chapters.forEach(ch => {
                        if (ch.num === chNum - 1) prevCh = ch;
                        if (ch.num === chNum + 1) nextCh = ch;
                    });
                });
                
                let prevBtnHtml = "";
                if (prevCh) {
                    prevBtnHtml = `
                        <button class="nav-prev-btn" onclick="loadChapter(${prevCh.num})">
                            <span class="nav-arrow"><i class="fa-solid fa-arrow-left"></i></span>
                            <span class="nav-btn-label">
                                <span class="nav-dir-sub">পূর্ববর্তী chapter</span>
                                <span class="nav-chapter-title">Ch ${prevCh.num}: ${prevCh.title}</span>
                            </span>
                        </button>
                    `;
                } else {
                    prevBtnHtml = `<div style="flex-grow: 1; max-width: 48%;"></div>`;
                }
                
                let nextBtnHtml = "";
                if (nextCh) {
                    nextBtnHtml = `
                        <button class="nav-next-btn" onclick="loadChapter(${nextCh.num})">
                            <span class="nav-btn-label">
                                <span class="nav-dir-sub">পরবর্তী chapter</span>
                                <span class="nav-chapter-title">Ch ${nextCh.num}: ${nextCh.title}</span>
                            </span>
                            <span class="nav-arrow"><i class="fa-solid fa-arrow-right"></i></span>
                        </button>
                    `;
                } else {
                    nextBtnHtml = `<div style="flex-grow: 1; max-width: 48%;"></div>`;
                }
                
                navDiv.innerHTML = prevBtnHtml + nextBtnHtml;
                contentDiv.appendChild(navDiv);
                
                // Apply current weights & themes
                applyFontWeightToPage();
                applyVisualThemeToPage();
                applyCodeThemeToPage();
                
                // Scroll to top
                document.querySelector(".content-container").scrollTop = 0;
                
            } catch (err) {
                console.error(err);
                document.getElementById("markdownContent").innerHTML = `
                    <div style="text-align: center; margin-top: 100px;">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 64px; color: #EF4444; margin-bottom: 20px;"></i>
                        <h2>চ্যাপ্টার লোড করতে ব্যর্থ হয়েছে</h2>
                        <p style="margin-top: 10px;">দয়া করে আপনার python server সচল আছে কি না তা চেক করুন।</p>
                    </div>
                `;
            }
        }

        // Custom parser to transform interview questions to collapsible flashcards
        function setupInteractiveInterviewQuestions() {
            const contentDiv = document.getElementById("markdownContent");
            const headers = contentDiv.querySelectorAll("h4");
            
            headers.forEach(h => {
                if (h.innerText.includes("Beginner") || h.innerText.includes("Intermediate") || h.innerText.includes("Advanced")) {
                    let sibling = h.nextElementSibling;
                    let elementsToRemove = [];
                    
                    while (sibling && sibling.tagName !== "H2" && sibling.tagName !== "H1") {
                        if (sibling.tagName === "OL" || sibling.tagName === "UL") {
                            const listItems = sibling.querySelectorAll("li");
                            listItems.forEach(li => {
                                const text = li.innerHTML;
                                if (text.includes("<strong>প্রশ্ন:</strong>") || text.includes("প্রশ্ন:")) {
                                    const parts = text.split(/<strong>উত্তর:<\/strong>|উত্তর:/);
                                    if (parts.length >= 2) {
                                        const card = document.createElement("div");
                                        card.className = "flashcard";
                                        card.onclick = () => {
                                            const ans = card.querySelector(".flashcard-a");
                                            ans.style.display = ans.style.display === "block" ? "none" : "block";
                                        };
                                        
                                        card.innerHTML = `
                                            <div class="flashcard-q">
                                                <span><i class="fa-solid fa-circle-question" style="color:var(--accent-purple); margin-right:8px;"></i> ${parts[0].replace(/<strong>প্রশ্ন:<\/strong>|প্রশ্ন:/, "").trim()}</span>
                                                <i class="fa-solid fa-chevron-down"></i>
                                            </div>
                                            <div class="flashcard-a">
                                                <strong><i class="fa-solid fa-circle-check" style="color:var(--accent-cyan);"></i> Answer:</strong>
                                                <p style="margin-top: 8px; margin-bottom:0;">${parts[1].trim()}</p>
                                            </div>
                                        `;
                                        sibling.parentNode.insertBefore(card, sibling);
                                    }
                                }
                            });
                            elementsToRemove.push(sibling);
                        }
                        sibling = sibling.nextElementSibling;
                    }
                    elementsToRemove.forEach(el => el.remove());
                }
            });
        }

        // Search engine scanning all chapters instantly
        async function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            if (!query) {
                loadChapter(currentChapterNum);
                return;
            }
            
            const resultsDiv = document.getElementById("markdownContent");
            resultsDiv.innerHTML = `
                <div style="text-align: center; margin-top: 50px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: var(--accent-purple);"></i>
                    <p style="margin-top:12px;">সম্পূর্ণ বই স্ক্যান করা হচ্ছে...</p>
                </div>
            `;
            
            let matches = [];
            for (let i = 1; i <= 28; i++) {
                try {
                    const resp = await fetch(`/handbook/chapter_${i}.md`);
                    if (resp.ok) {
                        const text = await resp.text();
                        const lines = text.split("\n");
                        lines.forEach(line => {
                            if (line.toLowerCase().includes(query) && line.length > 20) {
                                matches.push({
                                    chNum: i,
                                    text: line.replace(/[#*`_]/g, "").trim()
                                });
                            }
                        });
                    }
                } catch(e){}
            }
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = `
                    <div style="text-align: center; margin-top: 100px;">
                        <i class="fa-solid fa-face-frown" style="font-size: 64px; color: var(--text-secondary); margin-bottom: 20px;"></i>
                        <h2>কোনো ম্যাচ পাওয়া যায়নি</h2>
                        <p style="margin-top: 10px;">দয়া করে অন্য কোনো কিওয়ার্ড দিয়ে Search ট্রাই করুন।</p>
                    </div>
                `;
            } else {
                let html = `<h1>Search Results for "${query}"</h1><p>${matches.length} matches found across chapters:</p><hr>`;
                matches.slice(0, 30).forEach(m => {
                    html += `
                        <div style="background-color:var(--bg-secondary); border:1px solid var(--border-color); padding:16px; border-radius:8px; margin-bottom:12px; cursor:pointer;" onclick="loadChapter(${m.chNum})">
                            <span style="font-size:12px; font-weight:700; color:var(--accent-purple); text-transform:uppercase;">Chapter ${m.chNum}</span>
                            <p style="margin-top:6px; font-size:14.5px; color:var(--text-primary);">${m.text.replace(new RegExp(query, 'gi'), match => `<mark style="background:var(--accent-cyan); color:#000; padding:2px 4px; border-radius:3px;">${match}</mark>`)}</p>
                        </div>
                    `;
                });
                resultsDiv.innerHTML = html;
            }
        }

        // Restore user preferences
        if (localStorage.getItem('visualTheme')) {
            currentVisualTheme = localStorage.getItem('visualTheme');
        }
        if (localStorage.getItem('fontWeight')) {
            currentFontWeight = parseInt(localStorage.getItem('fontWeight'));
        }
        
        // Default code theme initialization (Sage Green if not set)
        if (localStorage.getItem('codeTheme')) {
            currentCodeTheme = localStorage.getItem('codeTheme');
        } else {
            currentCodeTheme = 'gray'; // Default to premium Sage Green theme!
            localStorage.setItem('codeTheme', 'gray');
        }

        // Default Light/White Mode state restored
        if (localStorage.getItem('themeState')) {
            isLight = localStorage.getItem('themeState') === 'light';
        } else {
            isLight = true; // Default to premium WHITE/LIGHT MODE!
            localStorage.setItem('themeState', 'light');
        }

        // Force browser classes on load
        document.documentElement.className = isLight ? "light" : "dark";
        
        setTimeout(() => {
            decorateCodeThemeButton();
            decorateVisualThemeButton();
            const icon = document.getElementById("themeIcon");
            icon.className = isLight ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }, 100);

        // ------------------ NEW PREMIUM LEARNING UTILITIES ------------------

        // 1. Estimated Reading Time & Word Count Generator
        function updateChapterMetadata() {
            const article = document.getElementById("markdownContent");
            if (!article) return;
            const text = article.innerText;
            const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
            const readTime = Math.max(1, Math.ceil(wordCount / 180)); // ~180 words per minute average reading speed
            
            // Clean up existing metadata tag if any
            const oldMeta = article.querySelector('.chapter-meta');
            if (oldMeta) oldMeta.remove();
            
            const h1 = article.querySelector("h1");
            if (h1) {
                const metaDiv = document.createElement("div");
                metaDiv.className = "chapter-meta";
                metaDiv.innerHTML = `
                    <span style="margin-right: 18px;"><i class="fa-regular fa-clock" style="color:var(--accent-purple); margin-right:5px;"></i> <strong>${readTime}</strong> Min Read</span>
                    <span><i class="fa-solid fa-pen-nib" style="color:var(--accent-cyan); margin-right:5px;"></i> <strong>${wordCount.toLocaleString()}</strong> Words</span>
                `;
                h1.parentNode.insertBefore(metaDiv, h1.nextSibling);
            }
        }

        // 2. Interactive Code Block "Copy Code" Logic
        async function copyCode(btn) {
            const pre = btn.parentElement;
            const code = pre.querySelector("code");
            if (!code) return;
            
            let text = code.innerText;
            
            try {
                await navigator.clipboard.writeText(text);
                btn.innerHTML = `<i class="fa-solid fa-check" style="color:#10B981;"></i>`;
                btn.style.borderColor = "#10B981";
                btn.title = "Copied!";
                
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
                    btn.style.borderColor = "";
                    btn.title = "Code কপি করুন";
                }, 2000);
            } catch (err) {
                console.error("Failed to copy code: ", err);
            }
        }

        // 3. Active Reading Scroll Progress Bar Event Listener
        const contentScrollContainer = document.querySelector(".content-container");
        if (contentScrollContainer) {
            contentScrollContainer.addEventListener("scroll", () => {
                const scrollTop = contentScrollContainer.scrollTop;
                const scrollHeight = contentScrollContainer.scrollHeight - contentScrollContainer.clientHeight;
                const percentage = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
                const progressBar = document.getElementById("scrollProgress");
                if (progressBar) {
                    progressBar.style.width = `${percentage}%`;
                }
            });
        }

        // 4. Keyboard Arrow Key Navigation E-book Controls
        document.addEventListener("keydown", (e) => {
            if (document.activeElement && document.activeElement.id === "searchInput") {
                return;
            }
            
            if (e.key === "ArrowLeft") {
                if (currentChapterNum > 1) {
                    loadChapter(currentChapterNum - 1);
                }
            } else if (e.key === "ArrowRight") {
                if (currentChapterNum < 28) {
                    loadChapter(currentChapterNum + 1);
                }
            }
        });

        // 5. Sidebar Chapter Progress Checklist Logic
        function getCompletedChapters() {
            try {
                return JSON.parse(localStorage.getItem('completedChapters') || '[]');
            } catch (e) {
                return [];
            }
        }

        function toggleChapterCompletion(chNum) {
            let completed = getCompletedChapters();
            const idx = completed.indexOf(chNum);
            
            if (idx > -1) {
                completed.splice(idx, 1);
            } else {
                completed.push(chNum);
            }
            
            localStorage.setItem('completedChapters', JSON.stringify(completed));
            populateSidebar();
            updateSidebarProgress();
        }

        function updateSidebarProgress() {
            const completed = getCompletedChapters();
            const total = 28;
            const percentage = Math.round((completed.length / total) * 100);
            
            const progressText = document.getElementById("progressText");
            const progressBar = document.getElementById("progressBar");
            
            if (progressText) progressText.innerText = `${percentage}% Completed`;
            if (progressBar) progressBar.style.width = `${percentage}%`;
        }

        // Initialize App
        populateSidebar();
        loadChapter(1);
        updateSidebarProgress();
    </script>
    <!-- MOBILE READER PREFERENCES BOTTOM SHEET -->
    <div id="settingsBackdrop" class="settings-sheet-backdrop" onclick="toggleSettingsSheet()"></div>
    <div id="settingsSheet" class="settings-sheet">
        <div class="settings-sheet-header">
            <h3>Reader Preferences</h3>
            <button class="close-sheet-btn" onclick="toggleSettingsSheet()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="settings-sheet-content">
            <div class="settings-option">
                <span class="option-label"><i class="fa-solid fa-circle-half-stroke"></i> Color Mode</span>
                <div class="option-controls">
                    <button class="sheet-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Day/Night</button>
                </div>
            </div>
            <div class="settings-option">
                <span class="option-label"><i class="fa-solid fa-font"></i> Text Size</span>
                <div class="option-controls btn-group" style="border:none; background:none;">
                    <button class="sheet-btn" onclick="adjustFontSize(-1)"><i class="fa-solid fa-minus"></i></button>
                    <button class="sheet-btn" onclick="adjustFontSize(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
            <div class="settings-option">
                <span class="option-label"><i class="fa-solid fa-bold"></i> Text Weight</span>
                <div class="option-controls btn-group" style="border:none; background:none;">
                    <button class="sheet-btn" onclick="adjustBold(-1)"><i class="fa-solid fa-minus"></i></button>
                    <button class="sheet-btn" onclick="adjustBold(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
            <div class="settings-option">
                <span class="option-label"><i class="fa-solid fa-code"></i> Code Block Theme</span>
                <div class="option-controls">
                    <button class="sheet-btn" onclick="cycleCodeTheme()"><i class="fa-solid fa-palette"></i> Cycle</button>
                </div>
            </div>
            <div class="settings-option">
                <span class="option-label"><i class="fa-solid fa-diagram-project"></i> Diagram Theme</span>
                <div class="option-controls">
                    <button class="sheet-btn" onclick="cycleVisualTheme()"><i class="fa-solid fa-palette"></i> Cycle</button>
                </div>
            </div>
        </div>
    </div>
</body>
